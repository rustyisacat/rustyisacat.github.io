<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 &middot; Rusty</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --md-primary: #6750A4;
    --md-on-primary: #FFFFFF;
    --md-secondary-container: #E8DEF8;
    --md-on-secondary-container: #1D192B;
    --md-tertiary: #7D5260;
    --md-surface: #FFFBFE;
    --md-surface-container-low: #F7F2FA;
    --md-on-surface: #1C1B1F;
    --md-on-surface-variant: #49454F;
    --md-outline-variant: #CAC4D0;
    --md-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --md-primary: #D0BCFF; --md-on-primary: #381E72;
      --md-secondary-container: #4A4458; --md-on-secondary-container: #E8DEF8;
      --md-tertiary: #EFB8C8;
      --md-surface: #141218; --md-surface-container-low: #1D1B20;
      --md-on-surface: #E6E0E9; --md-on-surface-variant: #CAC4D0;
      --md-outline-variant: #49454F;
    }
  }
  :root[data-theme="dark"]{
    --md-primary: #D0BCFF; --md-on-primary: #381E72;
    --md-secondary-container: #4A4458; --md-on-secondary-container: #E8DEF8;
    --md-tertiary: #EFB8C8;
    --md-surface: #141218; --md-surface-container-low: #1D1B20;
    --md-on-surface: #E6E0E9; --md-on-surface-variant: #CAC4D0;
    --md-outline-variant: #49454F;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--md-surface); color:var(--md-on-surface);
    font-family:'Roboto', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
  }
  .symbol{
    font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal;
    font-size:20px; line-height:1; display:inline-block;
    font-variation-settings:'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .wrap{ max-width:460px; text-align:center; }
  .figure{ width:180px; margin:0 auto 28px; animation: bob 4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-8px) rotate(-2deg);} }
  h1{ font-family:'Google Sans Text', sans-serif; font-size:2.4rem; margin:0 0 8px; font-weight:700; }
  .code{
    font-family:'Roboto Mono', monospace; font-size:.95rem; color:var(--md-on-surface-variant);
    background:var(--md-surface-container-low); border:1px solid var(--md-outline-variant);
    border-radius:12px; padding:14px 16px; text-align:left; margin:20px 0; line-height:1.7;
  }
  .code .prompt{ color:var(--md-primary); }
  p{ color:var(--md-on-surface-variant); line-height:1.6; margin:0 0 24px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:100px;
    background:var(--md-primary); color:var(--md-on-primary); text-decoration:none;
    font-weight:500; font-size:.95rem; box-shadow:var(--md-shadow);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:hover{ transform:translateY(-2px) rotate(-1deg); }
  .btn:focus-visible{ outline:3px solid var(--md-primary); outline-offset:3px; border-radius:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="figure" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--md-primary)"/>
          <stop offset="100%" stop-color="var(--md-tertiary)"/>
        </linearGradient>
      </defs>
      <rect x="72" y="146" width="56" height="10" rx="5" fill="url(#g)"/>
      <rect x="92" y="130" width="16" height="18" fill="url(#g)"/>
      <rect x="26" y="32" width="148" height="102" rx="18" fill="url(#g)"/>
      <rect x="42" y="48" width="116" height="70" rx="9" fill="var(--md-surface)"/>
      <path d="M56,68 L68,80 L56,92" fill="none" stroke="var(--md-on-surface-variant)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="76" y="86" width="18" height="7" rx="3.5" fill="#d93636"/>
      <rect x="56" y="102" width="70" height="6" rx="3" fill="var(--md-on-surface-variant)" opacity=".45"/>
      <rect x="113" y="83" width="9" height="13" fill="var(--md-primary)">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </svg>
    <h1>404</h1>
    <div class="code"><span class="prompt">$</span> cd /this-page<br>bash: cd: /this-page: No such file or directory</div>
    <p>Whatever you were looking for isn't here. It might've moved, or never existed in the first place.</p>
    <a class="btn" href="/"><span class="symbol">home</span> Back to the homepage</a>
  </div>
</body>
</html>
