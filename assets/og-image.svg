<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141218"/>
      <stop offset="100%" stop-color="#241A3C"/>
    </linearGradient>
    <linearGradient id="mon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0BCFF"/>
      <stop offset="100%" stop-color="#EFB8C8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- monitor illustration, scaled up version of the hero figure -->
  <g transform="translate(120,155) scale(2.1)">
    <rect x="72" y="146" width="56" height="10" rx="5" fill="url(#mon)"/>
    <rect x="92" y="130" width="16" height="18" fill="url(#mon)"/>
    <rect x="26" y="32" width="148" height="102" rx="18" fill="url(#mon)"/>
    <rect x="42" y="48" width="116" height="70" rx="9" fill="#141218"/>
    <path d="M56,68 L68,80 L56,92" fill="none" stroke="#CAC4D0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="86" width="30" height="7" rx="3.5" fill="#D0BCFF"/>
    <rect x="56" y="102" width="52" height="6" rx="3" fill="#CAC4D0" opacity=".55"/>
    <rect x="56" y="114" width="34" height="6" rx="3" fill="#CAC4D0" opacity=".55"/>
  </g>

  <text x="620" y="300" font-family="'Google Sans Text', Arial, sans-serif" font-weight="700" font-size="88" fill="#E6E0E9">Rusty</text>
  <text x="622" y="360" font-family="Arial, sans-serif" font-weight="400" font-size="32" fill="#CAC4D0">I make things that live entirely</text>
  <text x="622" y="404" font-family="Arial, sans-serif" font-weight="400" font-size="32" fill="#CAC4D0">on my own hardware.</text>

  <rect x="622" y="450" width="230" height="46" rx="23" fill="#4A4458"/>
  <text x="737" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#E8DEF8">rusty.is-a.dev</text>
</svg>
